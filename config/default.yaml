# Default configuration (version 1: Gemini + VieNeu-TTS, free, no GPU needed).
# Do not edit this file for personal settings: create config/local.yaml (git-ignored)
# with only the values you want to change. It is merged over this file.

# Compute device: auto (use GPU if available), cuda, or cpu.
device: auto

providers:
  asr: whisper_gemini         # whisper_gemini = Whisper times each line, Gemini writes the words
                              # gemini = Gemini only (faster, but timing can drift by seconds)
  translation: gemini
  tts: vieneu

gemini:
  model: "gemini-3.6-flash"   # Gemini 3.6 Flash (API model code); change here to use another model
  requests_per_minute: 10

whisper:                      # local speech timing (pip install faster-whisper, CPU)
  model: medium               # tiny / base / small / medium / large-v3 (bigger = more exact, slower)
  compute_type: int8          # int8 is fastest on CPU
  beam_size: 1                # 1 = fastest; 5 = slightly more accurate text
  cpu_threads: 0              # 0 = automatic
  detect_beeps: true          # bleeped (censored) words get their own line; Gemini writes the word
  pause_seconds: 0.4          # a pause in the speech this long starts a new line (timing comes from the sound)
  vad_threshold: 0.3          # speech detector sensitivity: lower hears quieter speech, higher ignores more noise
  max_segment_seconds: 12     # longer lines are cut at a pause so one subtitle never lasts too long

vieneu:                       # free local text to speech (pip install vieneu)
  mode: library               # library = runs inside this program; server = a separate VieNeu server
  voice: "Trúc Ly"          # preset voice name (list them with: video-translator voices)
  precision: fp32             # fp32 (default) or int8 (CPU only, faster, may garble on old CPUs)
  server_url: "http://localhost:8000"   # only used when mode is server
  timeout_seconds: 300

chunk_minutes: 5              # long videos are processed in chunks of this length
review: true                  # pause after translation so you can edit the Vietnamese text

blur:                         # blurred box over the Chinese subtitles + Vietnamese subtitles burned on top
  enabled: false              # on = the video is re-encoded when rendered (slower). Also settable per video in the editor
  x: null                     # box position and size in PIXELS of the original video (x/y empty = centred, near the bottom)
  y: null
  width: 1100
  height: 130
  strength: 70                # 1-100; higher = stronger blur (the Chinese text must be unreadable)
  tint: 0.0                   # 0-0.9: optional dark layer over the blur
  font_size: 40               # Vietnamese text height in pixels of the video
  font: Arial

subtitles:
  srt: true        # write a separate .srt file
  burn_in: false   # also burn subtitles into the video

audio:
  voice_volume: 1.0        # Vietnamese dub
  background_volume: 1.0   # music + effects
  ducked_volume: 0.25      # background level while the voice speaks
  remove_beeps: true       # silence the original bleep tones (the Vietnamese voice says the word)

paths:
  input: data/input
  work: data/work
  output: data/output
