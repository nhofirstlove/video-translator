[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-translator"
version = "0.1.0"
description = "Local tool that dubs Chinese videos into Vietnamese, keeping music and effects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
separation = ["demucs"]
tts = ["vieneu"]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.27"]
browser-tests = ["playwright>=1.40"]

[project.scripts]
video-translator = "video_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_translator = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
